 dos Campeões Europeus · Centro Comercial Alameda, loja 310 · Porto","editorial_context":["antes","depois"],"summary":"Opção de restauração no Centro Comercial Alameda, útil para considerar uma refeição prática na zona do estádio.","source_status":"published_info","source_status_label":"Identificado em pesquisa; confirmar antes da deslocação","verification_notes":"Confirmar horário do centro comercial e do restaurante para o dia do jogo.","sources":[{"label":"Ver no mapa","url":"https://www.google.com/maps/search/?api=1&query=Barcarola+Alameda+Porto"}],"editorial_experience":{"status":"not_visited_or_not_documented","notes":null},"supporter_suitability":{"status":"not_assessed","notes":null},"last_verified":"2026-10-13","route_role":"comida_rapida","route_position":"No destino"},{"id":"guimaraes-rei-cachorros","name":"O Rei dos Cachorros","category":"comida rápida","region":"Guimarães","address":"Rua Rainha Dona Maria II · Guimarães","editorial_context":["antes","depois"],"summary":"Estabelecimento identificado como opção de cachorros; alternativa para comer algo rápido no centro de Guimarães.","source_status":"published_info","source_status_label":"Identificado em pesquisa; confirmar antes da deslocação","verification_notes":"Confirmar horário e localização face ao estádio e ao estacionamento escolhido.","sources":[{"label":"Ver no mapa","url":"https://www.google.com/maps/search/?api=1&query=O+Rei+dos+Cachorros+Guimaraes"}],"editorial_experience":{"status":"not_visited_or_not_documented","notes":null},"supporter_suitability":{"status":"not_assessed","notes":null},"last_verified":"2026-10-13","route_role":"comida_rapida","route_position":"No destino"},{"id":"guimaraes-pregaria","name":"Pregaria de Guimarães","category":"comida rápida","region":"Guimarães","address":"Av. Dom Afonso Henriques, 15 · Guimarães","editorial_context":["antes","depois"],"summary":"Estabelecimento identificado como pregaria, relevante para quem procura uma refeição informal e rápida.","source_status":"published_info","source_status_label":"Identificado em pesquisa; confirmar antes da deslocação","verification_notes":"Confirmar horário, menu e disponibilidade na data do jogo.","sources":[{"label":"Ver no mapa","url":"https://www.google.com/maps/search/?api=1&query=Pregaria+de+Guimaraes"}],"editorial_experience":{"status":"not_visited_or_not_documented","notes":null},"supporter_suitability":{"status":"not_assessed","notes":null},"last_verified":"2026-10-13","route_role":"comida_rapida","route_position":"No destino"},{"id":"guimaraes-nova-camir","name":"Nova Camir","category":"café/pastelaria","region":"Guimarães","address":"Largo do Toural, 105 · Guimarães","editorial_context":["antes","depois"],"summary":"Confeitaria no Largo do Toural; possível opção para café, pastelaria ou uma paragem ligeira no centro.","source_status":"published_info","source_status_label":"Identificado em pesquisa; confirmar antes da deslocação","verification_notes":"Confirmar horário e avaliar o desvio até ao estádio conforme o plano de estacionamento.","sources":[{"label":"Ver no mapa","url":"https://www.google.com/maps/search/?api=1&query=Nova+Camir+Guimaraes"}],"editorial_experience":{"status":"not_visited_or_not_documented","notes":null},"supporter_suitability":{"status":"not_assessed","notes":null},"last_verified":"2026-10-13","route_role":"cafe_pastelaria","route_position":"No destino"}]}</script>
<script>
(()=>{
const data=JSON.parse(document.getElementById('data').textContent),app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Intl.DateTimeFormat('pt-PT',{day:'numeric',month:'long',year:'numeric'}).format(new Date(s+'T12:00:00')):'Data por confirmar';
const short=s=>s?new Intl.DateTimeFormat('pt-PT',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(s+'T12:00:00')).replace('.','').toUpperCase():'DATA POR CONFIRMAR';
const mapSearch=p=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((p.name+' '+(p.address||p.region||'')).trim());
function home(){
 document.title='Away 10A';
 const ms=[...data.matches].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
 app.innerHTML=`<div class="eyebrow">Época ${esc(data.season)}</div><h1>Jogos fora</h1><p class="intro">Escolhe um jogo para abrir a página completa da deslocação, com percurso, paragens e locais para comer.</p><span class="demo-label">VERSÃO DEMO · DADOS A CONFIRMAR</span><div class="games">${ms.map(m=>`<a class="game" href="#jogo/${encodeURIComponent(m.id)}"><div class="date">${esc(short(m.date))} · ${esc(m.destination)}</div><h2>${esc(m.home_team)} — ${esc(m.away_team)}</h2><div class="gamefoot"><span>${esc(m.kickoff_local?'Início às '+m.kickoff_local:'Horário por confirmar')}</span><span class="arrow">ABRIR ROTEIRO ↗</span></div></a>`).join('')}</div><p class="notice">Demo da época ${esc(data.season)}. Confirma data, horário, recinto, horários dos estabelecimentos e acessos antes da deslocação.</p>`;
}
const roleName=p=>({refeicao:'Restaurante / refeição',comida_rapida:'Comida rápida',cafe_pastelaria:'Café / pastelaria',docaria:'Doçaria local',paragem_viagem:'Paragem na viagem'})[p.route_role]||p.category||'Local';
function card(p){
 const maps=mapSearch(p);
 const sourceLinks=(p.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join('');
 return `<article class="place" data-role="${esc(p.route_role||'')}" data-search="${esc([p.name,p.address,p.summary,p.category].join(' ').toLowerCase())}"><div class="placecat">${esc(roleName(p))}</div><h3>${esc(p.name)}</h3><div class="status">${esc(p.source_status_label||'Informação por confirmar')}</div><div class="address">${esc(p.address||p.region||'Morada por confirmar')}</div><p class="summary">${esc(p.summary||'Descrição ainda não disponível.')}</p><div class="links"><a href="${esc(maps)}" target="_blank" rel="noopener">Localizar no mapa ↗</a>${sourceLinks}</div><button type="button" class="add-stop" data-stop="${esc(p.id)}">＋ Adicionar ao percurso</button>${p.verification_notes?`<div class="notice">${esc(p.verification_notes)}</div>`:''}</article>`;
}
function section(title,desc,arr,id){
 return `<section class="group"><div class="grouphead"><div><h2>${title}</h2><p>${desc}</p></div><span class="muted">${arr.length} ${arr.length===1?'local':'locais'}</span></div><div class="places" id="${id}">${arr.length?arr.map(card).join(''):`<div class="empty">Ainda não há locais associados a esta categoria neste roteiro. A secção fica preparada para acrescentar opções confirmadas.</div>`}</div></section>`;
}
function game(id){
 const m=data.matches.find(x=>x.id===id);if(!m){home();return}
 document.title=`${m.destination} — Away 10A`;
 const ps=(m.place_ids||[]).map(id=>data.places.find(p=>p.id===id)).filter(Boolean);
 const onway=ps.filter(p=>p.route_role==='paragem_viagem'||p.route_position==='No caminho');
 const quick=ps.filter(p=>['comida_rapida','cafe_pastelaria','docaria'].includes(p.route_role));
 const meals=ps.filter(p=>!onway.includes(p)&&!quick.includes(p));
 const venue=m.venue_status==='to_confirm'?'Recinto por confirmar':(m.venue||'Recinto por confirmar');
 const selectedStops=[];
 let routeMode='ida';
 const destinationLabel=()=>((m.venue_status==='to_confirm'||!m.venue)?m.destination+', Portugal':m.venue+', '+m.destination);
 const directionsUrl=(includeStops=false)=>{
   let chosen=includeStops?selectedStops.map(id=>ps.find(p=>p.id===id)).filter(Boolean):[];
   let origin=m.route?.origin||'Lisboa, Portugal';
   let destination=destinationLabel();
   if(routeMode==='regresso'){const oldOrigin=origin;origin=destination;destination=oldOrigin;if(includeStops)chosen=chosen.reverse();}
   const params=new URLSearchParams({api:1,origin,destination,travelmode:'driving'});
   if(chosen.length)params.set('waypoints',chosen.map(p=>[p.name,p.address||p.region||''].filter(Boolean).join(', ')).join('|'));
   return 'https://www.google.com/maps/dir/?'+params.toString();
 };
 const access=m.access_information||{};
 const statusText=access.status==='awaiting_match_specific_info'?'Instruções específicas do jogo ainda não publicadas':access.status==='awaiting_fixture_confirmation'?'Jogo e acessos por confirmar':'Informação de acesso por confirmar';
 app.innerHTML=`<a class="back" href="#">← Todos os jogos</a>
 <section class="hero"><div class="eyebrow">Away 10A · Época ${esc(data.season)}</div><h1>${esc(m.destination)}</h1><p class="match">${esc(m.home_team)} — ${esc(m.away_team)}</p><div>${esc(date(m.date))} · ${esc(m.kickoff_local||'Horário por confirmar')}</div><div class="pills"><span class="pill">${esc(venue)}</span><span class="pill">${ps.length} locais no roteiro</span></div></section>
 <section class="route"><div><strong id="routeHeading">A ida ao jogo</strong><p id="routeSummary">Lisboa → ${esc(m.destination)} · percurso de carro e opções para parar</p><div class="route-modes"><button type="button" class="route-mode active" data-route-mode="ida">Ida ao jogo</button><button type="button" class="route-mode" data-route-mode="regresso">Regresso a Lisboa</button></div></div><a class="btn" id="generalRouteLink" href="${esc(directionsUrl(false))}" target="_blank" rel="noopener">Abrir percurso no Google Maps ↗</a></section>
 <section class="route-builder"><div><strong>Personalizar percurso</strong><p id="routeBuilderDirection">Sentido: ida ao jogo.</p><p id="selectedStops">Ainda não selecionaste paragens.</p><div id="selectedStopList" class="stop-list"></div></div><div class="route-actions"><button class="btn-secondary" id="clearStops" type="button" disabled>Limpar</button><button class="btn" id="openCustomRoute" type="button" disabled>Abrir percurso com paragens ↗</button></div></section>
 <div class="tools"><input class="search" id="placeSearch" type="search" placeholder="Procurar local, morada ou tipo de comida…" aria-label="Procurar locais"><button class="filter active" data-filter="todos">Todos os locais</button><button class="filter" data-filter="paragem_viagem">No caminho</button><button class="filter" data-filter="refeicao">Refeição</button><button class="filter" data-filter="comida_rapida">Comida rápida</button><button class="filter" data-filter="cafe_pastelaria">Café / pastelaria</button></div>
 ${section('1. Paragens na viagem','Áreas de serviço e pontos úteis pelo caminho.',onway,'onway')}
 ${section('2. Refeição no destino','Restaurantes para uma refeição antes ou depois do jogo.',meals,'meals')}
 ${section('3. Comer depressa','Cafés, pastelarias, pregos, bifanas, cachorros e hambúrgueres quando há opções identificadas.',quick,'quick')}
 <section class="group"><div class="grouphead"><div><h2>Como avaliar as paragens</h2><p>A demo ainda não calcula desvios ou tempos de condução.</p></div></div><div class="access"><p>Ao abrir o Google Maps, verifica o tempo adicional de cada paragem, o horário no dia do jogo e a hora a que precisas de chegar ao estádio. As paragens selecionadas são enviadas pela ordem em que as adicionaste.</p><span class="caution">Percurso indicativo · confirmar no Google Maps</span></div></section>
 <section class="group"><div class="grouphead"><div><h2>4. Estádio e acessos</h2><p>Informação prática específica para o dia do jogo.</p></div></div><div class="access"><div class="caution">${esc(statusText)}</div><p>${esc(access.notes||'Ainda não existem instruções de acesso confirmadas para este jogo.')}</p><div class="links"><a href="${esc('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((m.venue||m.destination)+' '+m.destination))}" target="_blank" rel="noopener">Localizar estádio no Google Maps ↗</a></div></div></section>
 <p class="notice">Nota editorial: a presença no catálogo não significa que o local tenha sido visitado ou recomendado por experiência pessoal. Horários, preços, disponibilidade e acessos carecem de confirmação.</p>`;
 const updateRouteMode=()=>{
   const returning=routeMode==='regresso';
   app.querySelector('#routeHeading').textContent=returning?'O regresso a Lisboa':'A ida ao jogo';
   app.querySelector('#routeSummary').textContent=returning?`${m.destination} → Lisboa · percurso de carro e opções para parar`:`Lisboa → ${m.destination} · percurso de carro e opções para parar`;
   app.querySelector('#generalRouteLink').href=directionsUrl(false);
   app.querySelector('#routeBuilderDirection').textContent=returning?'Sentido: regresso a Lisboa. A ordem das paragens será invertida no Google Maps.':'Sentido: ida ao jogo.';
   app.querySelectorAll('[data-route-mode]').forEach(b=>b.classList.toggle('active',b.dataset.routeMode===routeMode));
 };
 app.querySelectorAll('[data-route-mode]').forEach(b=>b.addEventListener('click',()=>{routeMode=b.dataset.routeMode;updateRouteMode();updateRouteBuilder()}));
 const updateRouteBuilder=()=>{
   const label=app.querySelector('#selectedStops');
   const btn=app.querySelector('#openCustomRoute');
   const names=selectedStops.map(id=>ps.find(p=>p.id===id)).filter(Boolean).map(p=>p.name);
   label.textContent=names.length?`${names.length} paragem(ns), ordem base: ${names.join(' → ')}`:'Ainda não selecionaste paragens. Podes abrir o percurso geral acima.';
   btn.disabled=names.length===0;
   app.querySelector('#clearStops').disabled=names.length===0;
   app.querySelector('#selectedStopList').innerHTML=names.map((n,i)=>'<div class="stop-item"><span>'+(i+1)+'. '+esc(n)+'</span>'+(i>0?'<button type="button" data-move-up="'+i+'" aria-label="Mover '+esc(n)+' para cima">↑</button>':'')+(i<names.length-1?'<button type="button" data-move-down="'+i+'" aria-label="Mover '+esc(n)+' para baixo">↓</button>':'')+'</div>').join('');
   app.querySelectorAll('[data-move-up]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.moveUp);[selectedStops[i-1],selectedStops[i]]=[selectedStops[i],selectedStops[i-1]];updateRouteBuilder()}));
   app.querySelectorAll('[data-move-down]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.moveDown);[selectedStops[i+1],selectedStops[i]]=[selectedStops[i],selectedStops[i+1]];updateRouteBuilder()}));
 };
 app.querySelectorAll('[data-stop]').forEach(btn=>btn.addEventListener('click',()=>{
   const id=btn.dataset.stop;
   const index=selectedStops.indexOf(id);
   if(index>=0){selectedStops.splice(index,1);btn.classList.remove('selected');btn.textContent='＋ Adicionar ao percurso';}
   else{selectedStops.push(id);btn.classList.add('selected');btn.textContent='✓ Adicionado ao percurso';}
   updateRouteBuilder();
 }));
 app.querySelector('#openCustomRoute').addEventListener('click',()=>{if(selectedStops.length)window.open(directionsUrl(true),'_blank','noopener')});
 app.querySelector('#clearStops').addEventListener('click',()=>{selectedStops.splice(0,selectedStops.length);app.querySelectorAll('[data-stop]').forEach(b=>{b.classList.remove('selected');b.textContent='＋ Adicionar ao percurso'});updateRouteBuilder()});
 let active='todos';
 function apply(){
  const q=(app.querySelector('#placeSearch')?.value||'').trim().toLowerCase();
  app.querySelectorAll('.place').forEach(el=>{
   const role=el.dataset.role||'',search=el.dataset.search||'';
   const roleOk=active==='todos'||role===active||(active==='refeicao'&&role==='refeicao')||(active==='paragem_viagem'&&role==='paragem_viagem');
   el.classList.toggle('hidden',!roleOk||!search.includes(q));
  });
  app.querySelectorAll('.group').forEach(g=>{
   const cards=[...g.querySelectorAll('.place')];
   if(cards.length)g.classList.toggle('hidden',cards.every(c=>c.classList.contains('hidden')));
  });
 }
 app.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.filter;app.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));apply()}));
 app.querySelector('#placeSearch').addEventListener('input',apply);
 updateRouteMode();
 updateRouteBuilder();
}
function render(){const h=decodeURIComponent(location.hash||'');if(h.startsWith('#jogo/'))game(h.slice(6));else home();window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
// Hosted version uses the external JSON; the embedded copy guarantees local/offline opening.
if(location.protocol!=='file:')fetch('./away_10a_dados_2026-27.json').then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(Array.isArray(d.matches)&&Array.isArray(d.places)){Object.assign(data,d);render()}}).catch(()=>{});
})();
</script></body></html>
