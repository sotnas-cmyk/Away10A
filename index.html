function card(p){return `<article class="place"><div class="placecat">${esc(({refeicao:'Refeição',comida_rapida:'Comida rápida',cafe_pastelaria:'Café / pastelaria',docaria:'Doces e especialidades',paragem_viagem:'Paragem na viagem'})[p.route_role]||p.category||'Local')}</div><h3>${esc(p.name)}</h3><div class="status">${esc(p.source_status_label||'Informação por confirmar')}</div><div class="address">${esc(p.address||p.region||'Morada por confirmar')}</div><p class="summary">${esc(p.summary||'Descrição ainda não disponível.')}</p><div class="links">${(p.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join('')}</div>${p.verification_notes?`<div class="notice">${esc(p.verification_notes)}</div>`:''}</article>`}
function section(title,desc,arr){return `<section class="group"><div class="grouphead"><div><h2>${title}</h2><p>${desc}</p></div></div>${arr.length?`<div class="places">${arr.map(card).join('')}</div>`:`<div class="empty">Ainda não há locais confirmados nesta categoria para este jogo.</div>`}</section>`}
function game(id){let m=data.matches.find(x=>x.id===id);if(!m){home();return}document.title=`${m.destination} — Rota 10A`;let ps=(m.place_ids||[]).map(id=>data.places.find(p=>p.id===id)).filter(Boolean);let onway=ps.filter(p=>p.route_role==='paragem_viagem'||p.route_position==='No caminho');let quick=ps.filter(p=>['comida_rapida','cafe_pastelaria','docaria'].includes(p.route_role));let meals=ps.filter(p=>!onway.includes(p)&&!quick.includes(p));let venue=m.venue_status==='to_confirm'?'Recinto por confirmar':(m.venue||'Recinto por confirmar');app.innerHTML=`<a class="back" href="#">← Todos os jogos</a><section class="hero"><div class="eyebrow">Rota 10A · Época ${esc(data.season)}</div><h1>${esc(m.destination)}</h1><p class="match">${esc(m.home_team)} — ${esc(m.away_team)}</p><div>${esc(date(m.date))} · ${esc(m.kickoff_local||'Horário por confirmar')}</div><div class="pills"><span class="pill">${esc(venue)}</span><span class="pill">${ps.length} locais associados</span></div></section><section class="route"><div><strong>O caminho até ao jogo</strong><p>${esc(m.route?.origin||'Lisboa')} → ${esc(m.destination)} · paragens e opções para comer</p></div><a class="btn" href="${esc(m.route?.url||'https://www.google.com/maps')}" target="_blank" rel="noopener">Abrir percurso no Google Maps ↗</a></section>${section('1. Paragens na viagem','Áreas de serviço, cafés e pontos úteis pelo caminho.',onway)}${section('2. Refeição no destino','Restaurantes para uma refeição antes ou depois do jogo.',meals)}${section('3. Comer depressa','Cafés, pastelarias, pregos, bifanas, cachorros e hambúrgueres quando existam opções identificadas.',quick)}${section('4. Estádio e acessos','Informação específica do recinto, estacionamento e aproximação ao jogo.',[])}<p class="notice">A presença no catálogo não significa que o local tenha sido visitado ou recomendado por experiência pessoal. Horários, preços, disponibilidade e acessos carecem de confirmação.</p>`}
function render(){let h=decodeURIComponent(location.hash||'');if(h.startsWith('#jogo/'))game(h.slice(6));else home();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
if(location.protocol!=='file:')fetch('./rota10a_jogos_fora_dados_2026-27.json').then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(d.matches&&d.places){Object.assign(data,d);render()}}).catch(()=>{});
})();</script></body></html>
